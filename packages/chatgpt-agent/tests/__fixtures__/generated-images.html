<!-- Captured 2026-11-09 from a real three-image turn.
     Reduced to the gallery and side-rail semantics; URLs/message IDs anonymized.
     naturalwidth/naturalheight preserve live img.naturalWidth/naturalHeight.
     Image 2 is selected deliberately: export order must still be 1, 2, 3. -->
<section data-chatgpt-search-message-ids="msg-current msg-current msg-current">
  <div class="flex min-w-0 items-start gap-2">
    <div data-testid="generated-image-gallery">
      <div>
        <div data-web-image-tile="true">
          <button data-testid="generated-image-preview" aria-label="Generated image 2" aria-hidden="false">
            <img src="blob:https://chatgpt.com/current-2" naturalwidth="1024" naturalheight="1536" />
          </button>
        </div>
      </div>
    </div>
    <div role="group" aria-label="Generated images">
      <button type="button" aria-label="Show generated image 1" aria-pressed="false">
        <img loading="lazy" src="blob:https://chatgpt.com/current-1" naturalwidth="1024" naturalheight="1536" />
      </button>
      <button type="button" aria-label="Show generated image 2" aria-pressed="true">
        <img loading="lazy" src="blob:https://chatgpt.com/current-2" naturalwidth="1024" naturalheight="1536" />
      </button>
      <button type="button" aria-label="Show generated image 3" aria-pressed="false">
        <img loading="lazy" src="blob:https://chatgpt.com/current-3" naturalwidth="1672" naturalheight="941" />
      </button>
    </div>
  </div>
</section>
